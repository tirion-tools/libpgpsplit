# cargo-deny policy (tools/gate.sh audit): advisories, licences, bans and sources of the crate
# and its fuzz harness.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"
# Both are timing side channels in secret-key arithmetic of rPGP's pure-Rust backends; no fixed release exists for the
# pgp 0.21 line. Only the keyed half does secret-key arithmetic. Run it as a local, user-triggered, one-operation
# process with no network, so its duration never reaches an attacker as a timing oracle (README, Security model).
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: keyed unwrap/import is local and one process per operation; no network timing oracle" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 non-constant-time ops (ECC via elliptic-curve under pgp): same exposure as RUSTSEC-2023-0071; revisit when pgp moves to crypto-bigint 0.6" },
]

[licenses]
# Permissive licences only; anything else needs review before it is added here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # libbz2-rs-sys (pure-Rust bzip2 port, via the pgp bzip2 feature): permissive BSD-style licence.
  "bzip2-1.0.6",
  "ISC",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
