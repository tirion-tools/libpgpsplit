# Cheap check on every push and pull request (Actions minutes are limited while the repository is
# private): formatting only, no build. The real gate is local: tools/container.sh tools/gate.sh.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt --check (toolchain from rust-toolchain.toml)
        run: cargo fmt --check && cargo fmt --check --manifest-path fuzz/Cargo.toml
