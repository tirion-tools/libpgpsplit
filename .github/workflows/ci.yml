# The full gate (fmt, clippy, test, fuzz smoke, audit) in the pinned toolchain container, the same
# script as the local gate. Runs on release tags and manual dispatch.
name: ci

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools/gate.sh
        env:
          FUZZ_SECONDS: '60'
        run: tools/container.sh tools/gate.sh
